<text x="25" y="500" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">1. claim: runner job starts attempt n (SKIP LOCKED; job id run:node:visit:attempt)</text>
<text x="25" y="516" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">2. walker: branch not taken (if / merge rules)</text>
<text x="25" y="532" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">3. agent exit 0 + report, or shell exit 0</text>
<text x="25" y="548" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">4. approval node, or ctc.yaml setup policy ask: options[] shown</text>
<text x="25" y="564" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">5. exit != 0, report outcome failed, setup or worktree stage failed</text>
<text x="25" y="580" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">6. node timeout_s passed: process group killed</text>
<text x="25" y="596" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">7. worker restart finds no live pid and no exit record (never act on absence)</text>
<text x="605" y="500" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">8. agent reports usage limit; run paused until reset</text>
<text x="605" y="516" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">9. quota reset time reached: same attempt re-queued</text>
<text x="605" y="532" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">10. user picks an option: resolution stored, injected into the next prompt</text>
<text x="605" y="548" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">11. user cancels the run (any non-final state also allows cancel)</text>
<text x="605" y="564" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">12. POST .../retry: new attempt row n+1 (retry_of_step_id), only if failure_count &lt; 3</text>
<text x="605" y="580" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">13. third failed / timeout / start_unknown attempt: retry refused</text>
<text x="605" y="596" font-size="11" fill="#2C2C2A" text-anchor="start" font-family="Helvetica, Arial, sans-serif">14. user marks the unknown attempt failed from the Runs page</text>
</svg>
