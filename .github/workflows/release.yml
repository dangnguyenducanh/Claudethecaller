# CD: a v* tag on main -> GitHub Release with the wheel, sdist and dashboard tarball;
# every push to staging -> the same files as a workflow artifact (staging only receives PRs that passed ci.yml).
name: release

on:
  push:
    tags: ["v*"]
    branches: [staging]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12", enable-cache: true }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: dashboard/pnpm-lock.yaml }
      - name: Tag matches pyproject version and is on main
        if: github.ref_type == 'tag'
        run: |
          test "$GITHUB_REF_NAME" = "v$(uv version --short)" || { echo "::error::tag $GITHUB_REF_NAME != v$(uv version --short)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      - run: uv build
      - name: Dashboard tarball
        run: |
          pnpm -C dashboard install --frozen-lockfile
          pnpm -C dashboard build
          tar -czf "dist/ctc-dashboard-$(uv version --short).tar.gz" -C dashboard dist
      - if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with: { name: "ctc-staging-${{ github.sha }}", path: dist/ }
      - if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
